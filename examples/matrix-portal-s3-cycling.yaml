esphome:
  name: transit-tracker-cycling
  friendly_name: Transit Tracker (Cycling)
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(matrix)->set_rotation(display::DISPLAY_ROTATION_180_DEGREES);

esp32:
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: arduino

external_components:
  - source: github://TillFleisch/ESPHome-HUB75-MatrixDisplayWrapper@main
  - source:
      type: local
      path: ../components

logger:
  level: DEBUG
  logs:
    sensor: ERROR
    text_sensor: ERROR

ota:
  - platform: esphome
    password: ""

wifi:
  ssid: "ReplaceMe"
  password: "ReplaceMe!"
  power_save_mode: "NONE"

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "TransitTracker Fallback Hotspot"
    password: "59541bEJiaf3"

display:
  - platform: hub75_matrix_display
    id: matrix
    width: 64
    height: 32
    chain_length: 2
    R1_pin: 42
    G1_pin: 40
    B1_pin: 41
    R2_pin: 38
    G2_pin: 37
    B2_pin: 39
    A_pin: 45
    B_pin: 36
    C_pin: 48
    D_pin: 35
    E_pin: 21
    LAT_pin: 47
    OE_pin: 14
    CLK_pin: 2
    clock_phase: false
    i2sspeed: HZ_20M
    brightness: 255
    lambda: |-
      id(tracker).draw_schedule();

font:
  - file: "fonts/Pixolletta8px.ttf"
    id: pixolletta
    size: 10
    glyphs:
      - abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,:;!?()"'-+/*=%@#[]{}<>|&^~
      - " "

time:
  - platform: sntp
    id: sntp_time
    timezone: America/Los_Angeles

color:
  - id: c_28813F
    hex: "28813F"
  - id: c_007CAD
    hex: "007CAD"

transit_tracker:
  id: tracker
  base_url: "wss://tt.horner.tj/"
  limit: 6
  time_display: "arrival"
  show_units: "short"
  list_mode: "nextPerRoute"
  scroll_headsigns: false

  trips_per_page: 3
  page_cycle_duration: 5s

  show_remaining_trips: true
  # Only show "(-N)" when service is running thin: when N is at or below this
  # threshold. Useful for OBA-backed feeds where remainingTrips reflects only
  # the API forward window (~1-2 hours), so a low N reliably means
  # end-of-service is near.
  remaining_trips_threshold: 5

  stops:
    - stop_id: "st:40_99610"
      time_offset: "-12min"
      routes:
        - "st:40_100479"
        - "st:40_2LINE"
    - stop_id: "st:40_99603"
      time_offset: "-12min"
      routes:
        - "st:40_100479"
        - "st:40_2LINE"
  styles:
    - route_id: "st:40_100479"
      name: "1"
      color: c_28813F
    - route_id: "st:40_2LINE"
      name: "2"
      color: c_007CAD
  abbreviations:
    - from: "Lynnwood City Center"
      to: "Lynnwood"
    - from: "Downtown Redmond"
      to: "Redmond"
    - from: "Federal Way Downtown"
      to: "Federal Way"
