esphome:
  name: transit-tracker-cycling
  friendly_name: Transit Tracker (Cycling)
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(matrix)->set_rotation(display::DISPLAY_ROTATION_180_DEGREES);

esp32:
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: arduino

external_components:
  - source: github://TillFleisch/ESPHome-HUB75-MatrixDisplayWrapper@main
  - source:
      type: local
      path: ../components

logger:
  level: DEBUG
  logs:
    sensor: ERROR
    text_sensor: ERROR

ota:
  - platform: esphome
    password: ""
  - platform: web_server

# Native Home Assistant API. Generate your own key with:
#   openssl rand -base64 32
# and store it as a "secret" when adding the device in HA.
api:
  encryption:
    key: "ReplaceMeWithAGeneratedBase64Key="

# Built-in dashboard for log streaming, state inspection, and OTA.
# Hits the device at http://<hostname>/
web_server:
  port: 80
  version: 2

wifi:
  ssid: "ReplaceMe"
  password: "ReplaceMe!"
  power_save_mode: "NONE"

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "TransitTracker Fallback Hotspot"
    password: "59541bEJiaf3"

display:
  - platform: hub75_matrix_display
    id: matrix
    width: 64
    height: 32
    chain_length: 2
    R1_pin: 42
    G1_pin: 40
    B1_pin: 41
    R2_pin: 38
    G2_pin: 37
    B2_pin: 39
    A_pin: 45
    B_pin: 36
    C_pin: 48
    D_pin: 35
    E_pin: 21
    LAT_pin: 47
    OE_pin: 14
    CLK_pin: 2
    clock_phase: false
    i2sspeed: HZ_20M
    brightness: 255
    lambda: |-
      id(tracker).draw_schedule();

font:
  - file: "fonts/Pixolletta8px.ttf"
    id: pixolletta
    size: 10
    glyphs:
      - abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,:;!?()"'-+/*=%@#[]{}<>|&^~
      - " "

time:
  - platform: sntp
    id: sntp_time
    timezone: America/Los_Angeles

color:
  - id: c_28813F
    hex: "28813F"
  - id: c_007CAD
    hex: "007CAD"

transit_tracker:
  id: tracker
  base_url: "wss://tt.horner.tj/"
  limit: 6
  time_display: "arrival"
  show_units: "short"
  list_mode: "nextPerRoute"
  scroll_headsigns: false

  trips_per_page: 2
  page_cycle_duration: 5s

  show_remaining_trips: true
  # Only show "(-N)" when service is running thin: when N is at or below this
  # threshold. With GTFS-static feeds this is the true count of trips
  # remaining today, so a small threshold keeps the indicator focused on the
  # "only a few trains left" case rather than a constant high number.
  remaining_trips_threshold: 5

  # Walking-time origin. When set, the firmware tells the API to compute
  # per-stop walking-time offsets (haversine / walk_speed_ms) instead of
  # using time_offset on each stop. Lets presets switch with the right
  # offsets automatically.
  sign_location:
    lat: 47.614593
    lon: -122.317244
  walk_speed_ms: 1.4

  # Route presets. Each preset is a different set of stops/routes the
  # display will subscribe to. Switch between them at runtime via the
  # select entity below (which Home Assistant exposes for the Stream Deck
  # plugin to call). The first preset is the default at first boot.
  presets:
    - name: "Link"
      stops:
        - stop_id: "st_gtfs:99610"
          routes:
            - "st_gtfs:100479"
            - "st_gtfs:2LINE"
        - stop_id: "st_gtfs:99603"
          routes:
            - "st_gtfs:100479"
            - "st_gtfs:2LINE"
    - name: "Bus 8"
      stops:
        - stop_id: "kcm:29262"   # E John & Broadway Bay 2 → Seattle Center
          routes:
            - "kcm:100275"
        - stop_id: "kcm:29270"   # E John & Broadway Bay 1 → Mount Baker TC
          routes:
            - "kcm:100275"
    - name: "Bus 10"
      stops:
        - stop_id: "kcm:11520"   # Pine & 12th → Capitol Hill via 15th Ave E
          routes:
            - "kcm:100002"
        - stop_id: "kcm:11490"   # Pine & 13th → Downtown Seattle
          routes:
            - "kcm:100002"
    - name: "Bus 12"
      stops:
        - stop_id: "kcm:11520"   # Pine & 12th → Interlaken Park via 19th
          routes:
            - "kcm:100018"
        - stop_id: "kcm:11490"   # Pine & 13th → Downtown via Pine St
          routes:
            - "kcm:100018"
  styles:
    - route_id: "st_gtfs:100479"
      name: "1"
      color: c_28813F
    - route_id: "st_gtfs:2LINE"
      name: "2"
      color: c_007CAD
  abbreviations:
    - from: "Lynnwood City Center"
      to: "Lynnwood"
    - from: "Downtown Redmond"
      to: "Redmond"
    - from: "Federal Way Downtown"
      to: "Federal Way"
    # Bus headsigns. The walking pip + (-N) indicator make right-side
    # real estate tight on a 128px display, so trim aggressively.
    - from: "Mount Baker Transit Center"
      to: "Mt Baker"
    - from: "Seattle Center"
      to: "Sea Ctr"
    - from: "Capitol Hill Via 15th Ave E"
      to: "Cap Hill"
    - from: "Downtown Seattle Via Pine St"
      to: "Downtown"
    - from: "Downtown Seattle"
      to: "Downtown"
    - from: "Interlaken Park Via 19th Ave"
      to: "Interlaken"

# Exposed to Home Assistant. Stream Deck (via the HA plugin) calls
# select.select_option on this entity to switch the displayed preset.
# restore_value: true persists the active preset across reboots.
select:
  - platform: template
    name: "Transit Preset"
    id: transit_preset_select
    optimistic: true
    restore_value: true
    options:
      - "Link"
      - "Bus 8"
      - "Bus 10"
      - "Bus 12"
    initial_option: "Link"
    set_action:
      - lambda: |-
          id(tracker)->set_active_preset(x);
